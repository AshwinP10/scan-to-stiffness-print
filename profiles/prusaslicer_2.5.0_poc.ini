# Pinned print profile for the stiffness-to-infill proof of concept (PrusaSlicer 2.5.0).
# Settings that would distort the per-region infill measurement are explicitly disabled;
# each is annotated with why.

printer_technology = FFF
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4
filament_diameter = 1.75
gcode_flavor = marlin2
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
start_gcode =
end_gcode =

layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
extra_perimeters = 0
top_solid_layers = 4
bottom_solid_layers = 3

fill_pattern = rectilinear
fill_angle = 45
# Base density for the object; modifier volumes override it everywhere inside the footprint.
fill_density = 20%
infill_every_layers = 1
infill_only_where_needed = 0
infill_overlap = 25%

# Small Voronoi cells would otherwise be silently converted to 100% solid infill.
solid_infill_below_area = 0
# Anchors lay extra "Internal infill" extrusion along the perimeter, inflating edge-cell density.
infill_anchor = 0
infill_anchor_max = 0
# Can add solid infill next to walls, which would replace sparse infill in edge cells.
ensure_vertical_shell_thickness = 0
gap_fill_enabled = 0
thin_walls = 0

extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4

# Relative E makes per-move extrusion directly readable during verification.
use_relative_e_distances = 1
# Required by PrusaSlicer whenever relative E is on.
layer_gcode = G92 E0
skirts = 0
brim_width = 0
support_material = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = 0
