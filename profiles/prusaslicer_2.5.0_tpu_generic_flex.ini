# Pinned profile: stiffness-to-infill scan pipeline, PrusaSlicer 2.5.0, TPU.
# Print/printer settings from prusaslicer_2.5.0_poc.ini; filament settings below are
# [filament:Generic FLEX] resolved (with inherits) from PrusaSlicer's bundled
# resources/profiles/PrusaResearch.ini, config_version 1.5.1.

printer_technology = FFF
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4
gcode_flavor = marlin2
start_gcode =
end_gcode =

layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
extra_perimeters = 0
top_solid_layers = 4
bottom_solid_layers = 3

fill_pattern = rectilinear
fill_angle = 45
# Base density for the object; modifier volumes override it everywhere inside the footprint.
fill_density = 20%
infill_every_layers = 1
infill_only_where_needed = 0
infill_overlap = 25%

# Small Voronoi cells would otherwise be silently converted to 100% solid infill.
solid_infill_below_area = 0
# Anchors lay extra "Internal infill" extrusion along the perimeter, inflating edge-cell density.
infill_anchor = 0
infill_anchor_max = 0
# Can add solid infill next to walls, which would replace sparse infill in edge cells.
ensure_vertical_shell_thickness = 0
gap_fill_enabled = 0
thin_walls = 0

extrusion_width = 0.45
first_layer_extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.4

# Relative E makes per-move extrusion directly readable during verification.
use_relative_e_distances = 1
# Required by PrusaSlicer whenever relative E is on.
layer_gcode = G92 E0
skirts = 0
brim_width = 0
support_material = 0
complete_objects = 0
gcode_comments = 0
gcode_label_objects = 0

# ---- Filament: Generic FLEX (TPU) ----
bed_temperature = 50
bridge_fan_speed = 80
cooling = 0
disable_fan_first_layers = 3
extrusion_multiplier = 1.15
fan_always_on = 0
fan_below_layer_time = 100
filament_colour = #008000
filament_cooling_final_speed = 3.4
filament_cooling_initial_speed = 2.2
filament_cooling_moves = 4
filament_cost = 82
filament_density = 1.22
filament_deretract_speed = 25
filament_diameter = 1.75
filament_load_time = 0
filament_loading_speed = 28
filament_loading_speed_start = 3
filament_max_volumetric_speed = 1.2
filament_minimal_purge_on_wipe_tower = 15
filament_notes = ""
filament_ramming_parameters = "120 100 6.6 6.8 7.2 7.6 7.9 8.2 8.7 9.4 9.9 10.0| 0.05 6.6 0.45 6.8 0.95 7.8 1.45 8.3 1.95 9.7 2.45 10 2.95 7.6 3.45 7.6 3.95 7.6 4.45 7.6 4.95 7.6"
filament_retract_length = 0
filament_retract_lift = nil
filament_retract_speed = nil
filament_soluble = 0
filament_toolchange_delay = 0
filament_type = FLEX
filament_unload_time = 0
filament_unloading_speed = 90
filament_unloading_speed_start = 100
filament_vendor = Generic
filament_wipe = 0
first_layer_bed_temperature = 50
first_layer_temperature = 240
max_fan_speed = 90
min_fan_speed = 70
min_print_speed = 15
slowdown_below_layer_time = 15
temperature = 240
